<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmation Preview · Sweet Nothings by M</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-banner">Preview of the confirmation email the customer receives. The owner gets a matching "New order" email. <a href="index.html">Back to the site</a></div>
<div class="email-wrap" id="email"></div>

<script src="config.js"></script>
<script>
(function () {
  const cfg = SN.load();
  const esc = SN.esc, money = SN.money;
  const num = new URLSearchParams(location.search).get('o');
  let o = SN.getOrders().find((x) => x.number === num);
  let sample = false;
  if (!o) {
    sample = true;
    o = {
      number: 'SN-1042', status: 'New', eventType: 'Baby Shower',
      dateNeeded: SN.isoDate(SN.minDate(cfg)), fulfillment: 'pickup', address: null,
      customer: { name: 'Sample Customer', email: 'customer@example.com', phone: '(555) 555-0100' },
      items: [{ kind: 'custom', qty: 24, designs: 3, desc: 'Soft pink and gold, "Oh Baby" plaques, onesies and baby blocks, 8 of each.', photoName: 'inspo.jpg' }],
      taxRate: cfg.taxRate
    };
    o.items.forEach((it) => { it.lineTotal = SN.itemTotal(cfg, it); it.summary = SN.describeItem(cfg, it); });
    o.subtotal = o.items.reduce((a, it) => a + it.lineTotal, 0);
    o.tax = Math.round(o.subtotal * cfg.taxRate) / 100;
    o.deliveryFee = 0;
    o.total = o.subtotal + o.tax;
  }
  const first = (o.customer.name || '').split(' ')[0];
  const where = o.fulfillment === 'delivery' && o.address
    ? ['Drop-off to', esc(o.address.street) + ', ' + esc(o.address.city) + ' ' + esc(o.address.zip)]
    : ['Pickup at', esc(cfg.pickupAddress)];
  const items = o.items.map((it) =>
    '<div style="padding:8px 0">' +
      '<div style="display:flex;justify-content:space-between;gap:12px;font-size:15px"><span><strong>' + it.qty + ' ' + esc(SN.itemLabel(it.kind)) + '</strong></span><span>' + money(it.lineTotal) + '</span></div>' +
      '<div class="hint">' + esc(it.summary) + '</div>' +
      (it.desc ? '<div style="font-size:14px;color:var(--muted);background:#FBF7F4;border-radius:10px;padding:10px 12px;margin-top:6px"><strong style="color:var(--navy)">Your description:</strong> ' + esc(it.desc) + '</div>' : '') +
    '</div>').join('');

  document.getElementById('email').innerHTML =
    '<div class="email-meta"><strong style="color:var(--navy)">Subject:</strong> Your Sweet Nothings order ' + esc(o.number) + ' is in!<br>' +
      '<strong style="color:var(--navy)">To:</strong> ' + esc(o.customer.email) + (sample ? ' <em>(sample order)</em>' : '') + '</div>' +
    '<div class="email">' +
      '<div class="email-top"><img src="logo.png" alt="Sweet Nothings by M"><h1>Thank you' + (first ? ', ' + esc(first) : '') + '!</h1>' +
        '<p class="muted" style="margin:8px 0 0">Order number <strong style="color:var(--navy)">' + esc(o.number) + '</strong></p></div>' +
      '<div class="email-body">' +
        '<div style="background:var(--blush);border-radius:12px;padding:16px 18px;font-size:15px"><strong>Next step:</strong> I’ll review your order and send a QuickBooks invoice within 1–2 days. Your date is reserved once the invoice is paid.</div>' +
        '<div class="facts">' +
          '<div><div class="k">Needed by</div><div class="v">' + esc(SN.prettyDate(o.dateNeeded)) + '</div></div>' +
          '<div><div class="k">Occasion</div><div class="v">' + esc(o.eventType) + '</div></div>' +
          '<div><div class="k">' + where[0] + '</div><div class="v">' + where[1] + '</div></div>' +
          '<div><div class="k">Contact</div><div class="v">' + esc(o.customer.name) + '<br>' + esc(o.customer.phone) + '</div></div>' +
        '</div>' +
        '<div style="border-top:1px solid var(--line);padding-top:14px"><h2 style="font-size:24px;margin-bottom:6px">Your cookies</h2>' + items + '</div>' +
        '<div class="totals" style="border-top:1px solid var(--line);padding-top:14px">' +
          '<div><span class="muted">Subtotal</span><span>' + money(o.subtotal) + '</span></div>' +
          '<div><span class="muted">Grocery tax (' + o.taxRate + '%)</span><span>' + money(o.tax) + '</span></div>' +
          '<div><span class="muted">' + (o.fulfillment === 'delivery' ? 'Drop-off' : 'Pickup') + '</span><span>' + (o.fulfillment === 'delivery' ? money(o.deliveryFee) : 'Free') + '</span></div>' +
          '<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;align-items:baseline"><strong>Total</strong><strong style="font-family:var(--serif);font-size:30px">' + money(o.total) + '</strong></div>' +
        '</div>' +
        '<p class="hint" style="font-size:14px">Questions or changes? Just reply to this email and mention your order number.</p>' +
      '</div>' +
      '<div class="email-foot">Sweet Nothings by M · <a href="' + esc(cfg.instagram) + '">' + esc(cfg.instagramHandle) + '</a></div>' +
    '</div>';
})();
</script>
</body>
</html>
