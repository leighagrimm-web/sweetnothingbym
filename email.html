<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmation Preview · Sweet Nothings by M</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261031d">
</head>
<body>
<div class="proto-banner" id="banner">Email preview. <a href="index.html">Back to the site</a></div>
<div class="email-wrap" id="email"></div>

<script src="config.js?v=20261031d"></script>
<script>
SN.ready.then(function () {
  const cfg = SN.load();
  const esc = SN.esc, money = SN.money;
  const params = new URLSearchParams(location.search);
  const type = params.get('type') || 'request';      // request | invoice | declined
  const num = params.get('o');
  let o = SN.getOrders().find((x) => x.number === num);
  let sample = false;

  if (!o) {
    sample = true;
    o = {
      number: 'SN-1042', eventType: 'Baby Shower', dateNeeded: SN.isoDate(SN.minDate(cfg)), fulfillment: 'pickup', address: null,
      customer: { name: 'Sample Customer', email: 'customer@example.com', phone: '(847) 555-0100' },
      items: [{ kind: 'custom', qty: 24, designs: 3, desc: 'Soft pink and gold, "Oh Baby" plaques, onesies and baby blocks, 8 of each.', photoName: 'inspo.jpg' }],
      taxRate: 0
    };
    o.items.forEach((it) => { it.lineTotal = SN.itemTotal(cfg, it); it.summary = SN.describeItem(cfg, it); });
    o.subtotal = o.items.reduce((a, it) => a + it.lineTotal, 0);
    o.tax = 0;   // QuickBooks adds sales tax to the invoice
    o.deliveryFee = 0;
    o.total = o.subtotal + o.tax;
    if (type === 'invoice') {
      const lines = [{ desc: '24 Custom Cookies (3 designs)', qty: 24, unit: 6 }];
      const t = SN.invoiceTotals(lines, 0);
      o.invoice = Object.assign({ lines, fee: 0, note: 'These are going to be so cute! The hand-lettered plaques add $1 per cookie.', changed: true, sentAt: new Date().toISOString() }, t);
    }
    if (type === 'declined') o.declineNote = 'I\u2019m fully booked that weekend, but I\u2019d love to help with another date!';
  }

  const first = (o.customer.name || '').split(' ')[0];
  const isDel = o.fulfillment === 'delivery' && o.address;
  const where = isDel
    ? ['Drop-off to', esc(o.address.street) + ', ' + esc(o.address.city) + ' ' + esc(o.address.zip)]
    : ['Pickup', esc(cfg.pickupCity) + (type === 'invoice' ? ' (address above)' : ' (address sent once confirmed)')];
  const facts =
    '<div class="facts">' +
      '<div><div class="k">Needed by</div><div class="v">' + esc(SN.prettyDate(o.dateNeeded)) + '</div></div>' +
      '<div><div class="k">Occasion</div><div class="v">' + esc(o.eventType || 'Not specified') + '</div></div>' +
      '<div><div class="k">' + where[0] + '</div><div class="v">' + where[1] + '</div></div>' +
      '<div><div class="k">Contact</div><div class="v">' + esc(o.customer.name) + '<br>' + esc(o.customer.phone) + '</div></div>' +
      (o.allergies ? '<div style="grid-column:1 / -1"><div class="k">Allergies / dietary needs</div><div class="v">' + esc(o.allergies) + '</div></div>' : '') +
    '</div>';
  const row = (label, val, bold) => '<div' + (bold ? ' style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;align-items:baseline"' : '') + '><span' + (bold ? '' : ' class="muted"') + '>' + (bold ? '<strong>' + label + '</strong>' : label) + '</span>' + (bold ? '<strong style="font-family:var(--serif);font-size:30px">' + val + '</strong>' : '<span>' + val + '</span>') + '</div>';

  let subject, title, intro, middle = '', totals = '';
  if (type === 'invoice' && o.invoice) {
    const inv = o.invoice;
    subject = 'Order confirmed \u2013 please pay your invoice \u2013 Sweet Nothings ' + o.number;
    title = 'You\u2019re confirmed' + (first ? ', ' + esc(first) : '') + '!';
    intro = '<div style="background:var(--blush);border-radius:12px;padding:16px 18px;font-size:15px">' +
      (inv.changed ? 'I\u2019ve reviewed your order and updated the price. ' : 'I\u2019ve reviewed your order and it\u2019s all set. ') +
      'Pay the invoice below to lock in your date.</div>' +
      (inv.note ? '<div style="font-size:15px;border-left:3px solid var(--coral);padding:4px 0 4px 14px"><em>\u201c' + esc(inv.note) + '\u201d</em><br><span class="muted" style="font-size:13px">— Sweet Nothings</span></div>' : '') +
      // Pickup orders: the address is only shared here, in the confirmation (Settings: pickupAddress, pickupInstructions).
      (isDel ? '' : '<div style="border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15px">' +
        '<div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em">Pickup address</div>' +
        '<div style="font-weight:600;margin-top:2px">' + esc(cfg.pickupAddress) + '</div>' +
        (cfg.pickupInstructions ? '<div class="muted" style="margin-top:6px;font-size:14px">' + esc(cfg.pickupInstructions) + '</div>' : '') + '</div>');
    middle = '<div style="border-top:1px solid var(--line);padding-top:14px"><h2 style="font-size:24px;margin-bottom:6px">Your invoice</h2>' +
      inv.lines.map((l) => '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px"><span>' + esc(l.desc) + '<br><span class="hint">' + l.qty + ' \u00d7 ' + money(Number(l.unit)) + '</span></span><span>' + money(l.qty * l.unit) + '</span></div>').join('') + '</div>';
    totals = row('Subtotal', money(inv.subtotal)) + row('Sales tax', 'Added by QuickBooks on your invoice') +
      row(isDel ? 'Drop-off' : 'Pickup', isDel ? money(inv.fee) : 'Free') + row('Amount due (before tax)', money(inv.total), true) +
      (inv.changed ? '<div><span class="muted" style="font-size:13px">Your original estimate was ' + money(o.total) + '</span><span></span></div>' : '');
    totals += '</div><div style="text-align:center"><span class="btn" role="img" aria-label="Pay invoice button (links to QuickBooks in the real email)" style="pointer-events:none">Pay invoice \u00b7 ' + money(inv.total) + '</span>' +
      '<p class="hint" style="margin-top:8px">Secure payment by card or bank transfer through QuickBooks.</p>';
  } else if (type === 'declined') {
    subject = 'About your Sweet Nothings order request ' + o.number;
    title = 'Thank you for thinking of us' + (first ? ', ' + esc(first) : '');
    intro = '<div style="background:var(--blush);border-radius:12px;padding:16px 18px;font-size:15px">Unfortunately I\u2019m not able to take this order. You haven\u2019t been charged anything.</div>' +
      (o.declineNote ? '<div style="font-size:15px;border-left:3px solid var(--coral);padding:4px 0 4px 14px"><em>\u201c' + esc(o.declineNote) + '\u201d</em><br><span class="muted" style="font-size:13px">— Sweet Nothings</span></div>' : '');
  } else {
    subject = 'Order request received (not yet confirmed) \u2013 Sweet Nothings ' + o.number;
    title = 'We got your order request' + (first ? ', ' + esc(first) : '') + '!';
    intro =
      '<div class="not-final" role="note">' +
        '<div class="not-final-tag">Not a final order</div>' +
        '<p style="margin:8px 0 0">This email confirms we <strong>received your request</strong>. Your order is <strong>not confirmed yet</strong>, your date is <strong>not reserved</strong>, and the price below is an <strong>estimate</strong>. You haven\u2019t been charged anything.</p>' +
      '</div>' +
      '<div><h2 style="font-size:24px;margin-bottom:10px">What happens next</h2>' +
        '<ol class="next-steps">' +
          '<li class="done-step"><strong>Request received</strong><span>That\u2019s this email.</span></li>' +
          '<li><strong>I review your order</strong><span>I\u2019ll check the design, date and details, usually within 1\u20132 days.</span></li>' +
          '<li><strong>You get a second email: your confirmation</strong><span>It includes the final price and a QuickBooks invoice. If anything changed from this estimate, I\u2019ll explain why.</span></li>' +
          '<li><strong>Pay the invoice to lock in your date</strong><span>Your order is final once it\u2019s paid.</span></li>' +
        '</ol>' +
      '</div>';
    middle = '<div style="border-top:1px solid var(--line);padding-top:14px"><h2 style="font-size:24px;margin-bottom:6px">What you requested</h2>' +
      o.items.map((it) =>
        '<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;gap:12px;font-size:15px"><strong>' + it.qty + ' ' + esc(SN.itemLabel(it.kind)) + '</strong><span>' + (it.kind === 'custom' ? 'from ' : '') + money(it.lineTotal) + '</span></div>' +
        '<div class="hint">' + esc(it.summary) + '</div>' +
        (it.desc ? '<div style="font-size:14px;color:var(--muted);background:#FBF7F4;border-radius:10px;padding:10px 12px;margin-top:6px"><strong style="color:var(--navy)">Your description:</strong> ' + esc(it.desc) + '</div>' : '') +
        '</div>').join('') + '</div>';
    totals = row('Subtotal', money(o.subtotal)) + row('Sales tax', 'Added to your invoice') +
      row(isDel ? 'Drop-off' : 'Pickup', isDel ? money(o.deliveryFee) : 'Free') + row('Estimated total (before tax)*', money(o.total), true) +
      '<div><span class="hint">*Estimate only, not a final price. ' + (o.items.some((it) => it.kind === 'custom') ? esc(cfg.customNote || '') + ' ' : '') + 'Your final price, with sales tax, will be in your confirmation email.</span><span></span></div>';
  }

  const banners = {
    request: 'Preview: email #1, sent automatically when the customer sends their request. Sweet Nothings gets a matching \u201cNew order to review\u201d email.',
    invoice: 'Preview: email #2, the confirmation, sent when Sweet Nothings approves. In the real site QuickBooks sends the invoice with a Pay button.',
    declined: 'Preview: email the customer gets if Sweet Nothings declines the request.'
  };
  document.getElementById('banner').innerHTML = esc(banners[type] || banners.request) + (sample ? ' <em>(sample order)</em>' : '') + ' <a href="index.html">Back to the site</a>';

  document.getElementById('email').innerHTML =
    '<div class="email-meta"><strong style="color:var(--navy)">Subject:</strong> ' + esc(subject) + '<br>' +
      '<strong style="color:var(--navy)">To:</strong> ' + esc(o.customer.email) + '</div>' +
    '<div class="email">' +
      '<div class="email-top"><img src="logo.png" alt="Sweet Nothings by M"><h1>' + title + '</h1>' +
        '<p class="muted" style="margin:8px 0 0">Order number <strong style="color:var(--navy)">' + esc(o.number) + '</strong></p></div>' +
      '<div class="email-body">' + intro +
        (type === 'declined' ? '' : facts) +
        middle +
        (totals ? '<div class="totals" style="border-top:1px solid var(--line);padding-top:14px">' + totals + '</div>' : '') +
        '<p class="hint" style="font-size:14px">Questions or changes? Just reply to this email and mention your order number.</p>' +
      '</div>' +
      '<div class="email-foot">Sweet Nothings by M \u00b7 <a href="' + esc(cfg.instagram) + '">' + esc(cfg.instagramHandle) + '</a></div>' +
    '</div>';
});
</script>
</body>
</html>
