<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Cookie Gallery · Sweet Nothings by M</title>
<meta name="description" content="Custom decorated cookies for birthdays, baby showers, weddings, graduations and themed parties, made by Sweet Nothings by M in Rosemont, IL.">
<link rel="canonical" href="https://www.sweetnothingsbym.com/gallery">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sweet Nothings by M">
<meta property="og:title" content="Custom Cookie Gallery · Sweet Nothings by M">
<meta property="og:description" content="Custom decorated cookies for birthdays, baby showers, weddings, graduations and themed parties, made by Sweet Nothings by M in Rosemont, IL.">
<meta property="og:url" content="https://www.sweetnothingsbym.com/gallery">
<meta property="og:image" content="https://www.sweetnothingsbym.com/logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261031k">
</head>
<body data-page="gallery">
<div id="site-header"></div>
<main>
  <section class="hero wrap">
    <p class="eyebrow">Gallery</p>
    <h1 id="gallery-title"></h1>
    <p class="lead" id="gallery-intro"></p>
  </section>
  <section class="section wrap">
    <div class="gallery-grid" id="gallery"></div>
    <div style="text-align:center;margin-top:28px">
      <a class="btn" id="ig-link" href="#" target="_blank" rel="noopener">See more on Instagram</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="config.js?v=20261031k"></script>
<script src="layout.js?v=20261031k"></script>
<script src="order.js?v=20261031k"></script>
<script>
  // Photos come from the Sheet's Gallery tab (one per row, in order); heading from the Pages tab.
  document.getElementById('ig-link').href = SN.load().instagram;
  SN.ready.then(() => {
    const cfg = SN.load();
    document.getElementById('gallery-title').textContent = cfg.pages.galleryTitle;
    document.getElementById('gallery-intro').textContent = cfg.pages.galleryIntro;
    document.getElementById('gallery').innerHTML = (cfg.gallery || []).map((g) => SN.photoHtml(g.photo, SN.photoAlt(g.caption), 'aspect-ratio:1/1;border-radius:14px')).join('');
    document.getElementById('ig-link').href = cfg.instagram;
  });
</script>
</body>
</html>
