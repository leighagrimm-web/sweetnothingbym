<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · Sweet Nothings by M</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery">
<div id="site-header"></div>
<main>
  <section class="hero wrap">
    <p class="eyebrow">Gallery</p>
    <h1>Past creations</h1>
    <p class="lead">A peek at cookies made for birthdays, showers, weddings and more. See the newest work on Instagram.</p>
  </section>
  <section class="section wrap">
    <div class="gallery-grid" id="gallery"></div>
    <div style="text-align:center;margin-top:28px">
      <a class="btn" id="ig-link" href="#" target="_blank" rel="noopener">See more on Instagram</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script>
  // Swap these for real photos: put image files in /assets/gallery and list them here.
  const photos = [];
  const labels = ['Birthday', 'Baby shower', 'Wedding shower', 'Anniversary', 'Holiday', 'Party', 'Artisan box', 'Custom set'];
  document.getElementById('gallery').innerHTML = photos.length
    ? photos.map((p) => '<img src="' + SN.esc(p.src) + '" alt="' + SN.esc(p.alt) + '" style="aspect-ratio:1/1;object-fit:cover;border-radius:14px;width:100%">').join('')
    : labels.map((l) => '<div class="placeholder">[' + l + ' cookie photo]</div>').join('');
  document.getElementById('ig-link').href = SN.load().instagram;
</script>
</body>
</html>
