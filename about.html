<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · Sweet Nothings by M</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261026d">
</head>
<body data-page="about">
<div id="site-header"></div>
<main>
  <section class="hero wrap">
    <p class="eyebrow">About</p>
    <h1 id="about-title"></h1>
    <p class="lead" id="about-intro"></p>
  </section>
  <section class="section wrap">
    <div class="two-col">
      <div id="about-photo"></div>
      <div class="content-card">
        <h2 id="about-story-h" style="font-size:32px;margin-bottom:14px"></h2>
        <div id="about-story"></div>
        <h3 id="about-good-h" style="font-size:24px;margin:22px 0 10px"></h3>
        <div id="about-good"></div>
        <a class="btn" href="order.html" style="margin-top:8px">Start your order</a>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="config.js?v=20261026d"></script>
<script src="layout.js?v=20261026d"></script>
<script>
// Wording and photo come from the Sheet's Pages tab.
SN.ready.then(function () {
  const p = SN.load().pages;
  const $ = (id) => document.getElementById(id);
  $('about-title').textContent = p.aboutTitle;
  $('about-intro').textContent = p.aboutIntro;
  $('about-photo').innerHTML = SN.photoHtml(p.aboutPhoto, p.aboutTitle, 'aspect-ratio:4/5;border-radius:14px');
  $('about-photo').hidden = !$('about-photo').innerHTML;   // no photo: the story card takes the full width
  $('about-story-h').textContent = p.aboutStoryHeading;
  $('about-story').innerHTML = SN.paras(p.aboutStory);
  $('about-good-h').textContent = p.aboutGoodToKnowHeading;
  $('about-good-h').hidden = !p.aboutGoodToKnowHeading;
  $('about-good').innerHTML = SN.paras(p.aboutGoodToKnow);
});
</script>
</body>
</html>
