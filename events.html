<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Events · Sweet Nothings by M</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="events">
<div id="site-header"></div>
<main>
  <section class="hero wrap">
    <p class="eyebrow">Special events</p>
    <h1 id="events-title"></h1>
    <p class="lead" id="events-intro"></p>
  </section>
  <section class="section wrap">
    <div class="menu-grid" id="events"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
// Heading from the Sheet's Pages tab; one card per row on the Events tab.
SN.ready.then(function () {
  const cfg = SN.load();
  const esc = SN.esc;
  document.getElementById('events-title').textContent = cfg.pages.eventsTitle;
  document.getElementById('events-intro').textContent = cfg.pages.eventsIntro;
  function button(ev) {
    if (ev.button === 'Order now') return '<a class="btn" href="order.html">Order now</a>';
    if (ev.button === 'Message me') return '<button type="button" class="btn ghost" data-quick-message="Special events or classes">Message me</button>';
    if (ev.button === 'Sign up') {
      return /^https?:\/\//.test(ev.link)
        ? '<a class="btn" href="' + esc(ev.link) + '" target="_blank" rel="noopener">Sign up</a>'
        : '<a class="btn ghost" href="#" aria-disabled="true">Sign-up details coming soon</a>';
    }
    return '';
  }
  const cards = (cfg.events || []).map((ev) =>
    '<article class="card">' +
      SN.photoHtml(ev.photo, ev.title, 'height:200px;border-radius:0') +
      '<div class="card-body">' +
        (ev.when ? '<p class="eyebrow" style="margin:0">' + esc(ev.when) + '</p>' : '') +
        '<h3>' + esc(ev.title) + '</h3>' +
        (ev.desc ? '<div class="desc">' + SN.paras(ev.desc) + '</div>' : '') +
        (ev.price ? '<p class="price">' + esc(ev.price) + '</p>' : '') +
        button(ev) +
      '</div>' +
    '</article>').join('');
  document.getElementById('events').innerHTML = cards || '<p class="muted">No events right now. Follow along on Instagram for the next one.</p>';
  document.querySelectorAll('#events a[aria-disabled="true"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
});
</script>
</body>
</html>
