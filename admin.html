<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Sweet Nothings by M</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261027o">
</head>
<body>
<!--
  The owner admin lives on Google Apps Script now (apps-script/Admin.html), behind the owner's Google sign-in.
  This page just links there. On localhost, admin.html?dev=1 runs the admin against fake data for testing
  (.claude/admin-dev.js, not part of the website).
-->
<div id="admin-app">
  <div class="wrap" style="padding:64px 0;max-width:560px">
    <p class="eyebrow">Owner admin</p>
    <h1>The admin has moved</h1>
    <p class="lead">It now opens with your Google account, so only you can see orders and change settings.</p>
    <p style="margin-top:24px"><a class="btn btn-lg" id="admin-link" href="#">Open the admin</a></p>
    <p class="hint" id="admin-missing" hidden>The admin link hasn't been set up yet.</p>
  </div>
</div>
<script src="config.js?v=20261027o"></script>
<script>
(function () {
  const dev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('dev');
  if (dev) {
    window.SN_ADMIN = { siteUrl: location.origin + '/' };
    ['.claude/admin-dev.js', 'admin.js?v=' + Date.now()].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = src; s.onload = res; document.body.appendChild(s);
    })), Promise.resolve());
    return;
  }
  if (SN_ENV.admin) document.getElementById('admin-link').href = SN_ENV.admin;
  else { document.getElementById('admin-link').hidden = true; document.getElementById('admin-missing').hidden = false; }
})();
</script>
</body>
</html>
